name: Check AEP Compliance

on:
  pull_request:
    paths:
      - 'api/**/openapi.source.yaml'
      - '.spectral.yaml'

jobs:
  check-aep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check AEP compliance
        run: make check-aep
